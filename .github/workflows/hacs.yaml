name: Validate with HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate with HACS
    runs-on: "ubuntu-latest"
    steps:
      # HACS documents @main so validation tracks the current store requirements
      - uses: "hacs/action@main" # zizmor: ignore[unpinned-uses]
        with:
          category: "integration"
